<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ledgii — setup flow</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  /* No body rules: this stylesheet is injected into the running app on web, and
     anything targeting body would restyle the app around it. */
  .lg-setup-host{font:400 15px system-ui,-apple-system,"Segoe UI",sans-serif}
  /* Full-bleed — it is the screen, not a framed demo.
     Sizing note, learned the hard way: a percentage height on a fixed element is
     measured against the window, and inside an embedded panel in a native app
     that measurement can be taken while the panel still has no height. Zero in,
     zero out — the flow paints perfectly into a box nobody can see. So the four
     pinned edges define the size (they cannot resolve to zero), viewport units
     are the fallback rather than the foundation, and a minimum height keeps an
     early or bogus measurement from collapsing the whole flow. */
  .phone{position:fixed; top:0; right:0; bottom:0; left:0; width:100%; border-radius:0;
         min-height:100vh; overflow:hidden; box-shadow:none}
  @supports (height: 100dvh) { .phone{min-height:100dvh} }
  .page{position:absolute; top:0; right:0; bottom:0; left:0; display:flex; flex-direction:column;
        padding:calc(env(safe-area-inset-top,0px) + 26px) 22px calc(env(safe-area-inset-bottom,0px) + 22px);
        opacity:0; transform:translateX(26px); pointer-events:none;
        transition:opacity .30s ease, transform .34s cubic-bezier(.2,.85,.25,1)}
  .page.on{opacity:1; transform:translateX(0); pointer-events:auto}
  /* First paint after sign-in / log-in: rise and settle instead of cutting in. */
  #pg0.on{animation:suEnter .44s cubic-bezier(.2,.9,.2,1) both}
  @keyframes suEnter{from{opacity:0; transform:translateY(16px) scale(.985)} to{opacity:1; transform:none}}
  .page.off-l{transform:translateX(-26px)}
  .phone h1{font-size:27px; font-weight:800; letter-spacing:-.5px; line-height:1.15; margin:0}
  .sub{font-size:14px; font-weight:600; line-height:1.45; margin:9px 0 0}
  .lbl{font-size:12.5px; font-weight:700; margin:14px 0 6px 6px}
  /* A scrolling box clips at its own edge, so anything that springs past its
     normal size — the plan cards, their badges — was getting shaved. The box is
     pulled 9px wider on each side and padded back by the same amount: children
     land exactly where they did, with room for the overshoot to grow into. */
  /* touch-action tells the engine this box is a vertical scroller before the
     gesture finishes — without it the first drag is ambiguous, which is the
     window an ancestor uses to claim it. */
  .grow{flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; touch-action:pan-y;
        -webkit-overflow-scrolling:touch;
        margin:0 -9px; padding:0 9px 9px;
        scrollbar-width:none; -ms-overflow-style:none}
  .grow::-webkit-scrollbar{width:0; height:0}
  .btnrow{display:flex; gap:10px; padding-top:14px}
  .primary{flex:1; border:none; border-radius:999px; padding:17px; cursor:pointer;
           font:800 15.5px system-ui,sans-serif; transition:transform .12s, filter .15s}
  .primary:active{transform:scale(.97); filter:brightness(.92)}
  .ghost{flex:0 0 auto; min-width:104px; border-radius:999px; padding:17px 18px; cursor:pointer;
         font:800 15.5px system-ui,sans-serif; background:transparent}
  .track{display:flex; gap:6px; margin:2px 0 18px}
  .tstep{flex:1; text-align:center}
  .tbar{height:4px; border-radius:99px; overflow:hidden; margin-bottom:6px}
  .tbar i{display:block; height:100%; width:0; border-radius:99px; transition:width .45s cubic-bezier(.2,.85,.25,1)}
  .tstep.done .tbar i{width:100%}
  .tstep.now .tbar i{width:45%}
  .tstep span{font-size:10.5px; font-weight:800; letter-spacing:.3px}
  /* 16px minimum: anything smaller makes iOS Safari zoom in on focus. */
  .phone input, .phone select{font:700 16px system-ui,sans-serif; border-radius:16px; padding:13px 14px;
        border:1.5px solid transparent; outline:none; width:100%}
  .row2{display:flex; gap:8px}
  /* Both fields share the row evenly. Without this the width:100% input wins
     and squeezes the weekday / due-day control down to nothing. */
  .row2 > *{flex:1 1 0; min-width:0}
  /* The weekday / due-day control only needs a short value, so it takes a
     quarter of the row and the amount field keeps the rest. */
  .row2 > .narrow{flex:0 0 27%}
  .row2 select, .row2 input{width:100%; min-width:0}
  .addbtn{border:none; border-radius:14px; padding:12px; width:100%; cursor:pointer;
          font:800 14px system-ui,sans-serif; margin-top:10px}
  .item{border-radius:18px; padding:14px; margin-bottom:10px}
  /* Each source is its own card, the way Settings lists them: a quiet
     caption, the fields, and an X that removes the whole thing. */
  .ihead{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px}
  .iname{font-size:11px; font-weight:800; letter-spacing:.5px}
  .del{border:none; background:transparent; cursor:pointer; padding:5px; border-radius:10px;
       line-height:0; transition:transform .12s}
  .del:active{transform:scale(.88)}
  .seg{display:flex; gap:6px; padding:4px; border-radius:999px; margin:10px 0 2px}
  .seg button{flex:1; padding:10px 0; border:none; border-radius:999px; cursor:pointer;
              font:800 13px system-ui,sans-serif}
  .lg-details summary::-webkit-details-marker{display:none}
  /* ── week cards ──
     Copied from the app's own Plan tab so the preview behaves identically:
     the whole card is the target, the caret turns, and the body opens by
     animating a grid row from 0fr to 1fr rather than a measured height. */
  .su-wk{transition: transform .11s ease, background .18s ease, box-shadow .25s}
  .su-wk-tap{cursor:pointer}
  .su-wk-tap:active{transform:scale(.989)}
  .su-wk-cue{display:flex; align-items:center; gap:6px}
  .su-wk-caret{display:inline-block; font-size:11px; line-height:1;
               transition: transform .21s cubic-bezier(.26,.82,.28,1)}
  .su-wk[aria-expanded='true'] .su-wk-caret{transform:rotate(180deg)}
  .su-wk-body{display:grid; grid-template-rows:0fr;
              transition: grid-template-rows .29s cubic-bezier(.26,.82,.28,1)}
  .su-wk[aria-expanded='true'] .su-wk-body{grid-template-rows:1fr}
  .su-wk-bodyinner{overflow:hidden; min-height:0}
  .plan{display:flex; align-items:center; gap:12px; border-radius:20px; padding:15px 16px;
        margin-bottom:12px; cursor:pointer; position:relative; border:1.5px solid transparent;
        transition:transform .18s cubic-bezier(.34,1.56,.64,1), border-color .2s, box-shadow .2s}
  .plan:active{transform:scale(.97)}
  /* the chosen card springs past its size and settles — a small confirmation */
  .plan.pop{animation:planPop .34s cubic-bezier(.34,1.56,.64,1)}
  /* ── the moment after subscribing ──
     A held beat between "I just paid" and the app itself: the ring draws, the
     line lands, then the whole flow lifts away so the home screen is revealed
     rather than cut to. */
  .su-done{position:absolute; top:0; right:0; bottom:0; left:0; display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:16px; text-align:center;
           padding:0 34px; opacity:0; animation:suDoneIn .34s ease both; z-index:5}
  @keyframes suDoneIn{from{opacity:0} to{opacity:1}}
  .su-ring{width:84px; height:84px; border-radius:999px; display:flex; align-items:center;
           justify-content:center; animation:suRing .52s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes suRing{0%{transform:scale(.4); opacity:0} 60%{opacity:1} 100%{transform:scale(1); opacity:1}}
  .su-ring path{stroke-dasharray:30; stroke-dashoffset:30; animation:suTick .42s .22s ease-out both}
  @keyframes suTick{to{stroke-dashoffset:0}}
  .su-done h2{margin:0; font-size:24px; font-weight:800; letter-spacing:-.4px;
              animation:suRise .44s .18s cubic-bezier(.2,.9,.2,1) both}
  .su-done p{margin:0; font-size:14.5px; font-weight:600; line-height:1.45;
             animation:suRise .44s .3s cubic-bezier(.2,.9,.2,1) both}
  @keyframes suRise{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
  /* the hand-off itself: lift and fade, so the app appears behind it */
  .phone.su-leave{animation:suLeave .42s cubic-bezier(.4,0,.2,1) both}
  @keyframes suLeave{to{opacity:0; transform:scale(1.04)}}
  @keyframes planPop{ 0%{transform:scale(.97)} 55%{transform:scale(1.035)} 100%{transform:scale(1)} }
  .badge{position:absolute; top:-9px; left:14px; font-size:10px; font-weight:800; letter-spacing:.5px;
         border-radius:99px; padding:3px 9px}
  .feat{font-size:13.5px; font-weight:600; line-height:1.7; margin:12px 0 0}
  .soft{font-size:12px; font-weight:600; line-height:1.55; text-align:center; margin-top:12px}
</style></head>

<div class="phone" id="phone"></div>
<script>
/* First line of defense: any error anywhere in this script is reported to the
   app before it can turn into a silent blank screen. Safe on the web — the
   bridge simply isn't there. */
window.onerror = function(msg, src, line){
  try{
    if (window.LedgiiSetupBridge && window.LedgiiSetupBridge.jsError)
      window.LedgiiSetupBridge.jsError(String(msg), String(line || 0));
  }catch(_){}
};
window.LedgiiSetup = (function(){
const DAY = 86400000;
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function sod(d) { const x = new Date(d); x.setHours(0,0,0,0); return x; }

/* The day a bill started existing, "YYYY-MM-DD". Absent means "no history to
   speak of", which for a wizard-built ledger is always today. */

  if (!k) return sod(today || new Date());

}
const fmtR = (a, b) => a.toLocaleDateString("en-US",{month:"short",day:"numeric"}) + " – " + b.toLocaleDateString("en-US",{day:"numeric"});

  else if (h < 240) [r, g, b] = [0, x, c];

    dark: false,
    primary: t(a, 42), onPrimary: "#fff",

    secondaryC: t(22, 88), onSecondaryC: t(26, 20),
    surface: t(14, 98), surfaceC: t(14, 95), surfaceCH: t(14, 93), surfaceCHH: t(14, 90),
    onSurface: t(10, 12), onSurfaceVar: t(12, 36),
    outline: t(10, 54), outlineVar: t(10, 84),

    danger: "#b3261e", dangerC: "#ffdad5",

    dark: true,
    primary: t(Math.min(a, 70), 80), onPrimary: t(a, 18),
    primaryC: t(Math.min(a, 58), 32), onPrimaryC: t(60, 90),
    secondaryC: t(16, 30), onSecondaryC: t(18, 88),
    surface: t(12, 7), surfaceC: t(12, 12), surfaceCH: t(12, 17), surfaceCHH: t(12, 22),
    onSurface: t(8, 91), onSurfaceVar: t(10, 80),
    outline: t(8, 60), outlineVar: t(8, 32),

    if (!(e.amount > 0)) return;
    /* Land it on the day the user expects it; anything already due sits on today so it still shows. */
    const ed = sod(new Date(e.dateMillis || Date.now()));

    we = we.sort((a, b) => (a.date - b.date) || (b.amount - a.amount));

    we.forEach(e => { running += e.amount; mn = Math.min(mn, running); });

    if (!a) return [];
    const out = [];
    for (let d = sod(start); d <= end; d = addDays(d, 1)) {
      const diff = dayNum(d) - dayNum(a);
      if (((diff % 14) + 14) % 14 === 0) out.push(new Date(d));

  }

  const out = [];

    const amt = parseFloat((document.getElementById(id + "_a").value || "").replace(/[^0-9.]/g, ""));

      + (has ? ' role="button" tabindex="0" aria-expanded="'+(open?"true":"false")+'" onclick="LedgiiSetup.toggleWeek('+w.idx+')"' : '')
      + ' style="background:'+sc.surfaceC+'; border-radius:24px; padding:16px; border-left:5px solid '+toneColor(cs2.key)+'">'
      + '<div style="display:flex; align-items:center; justify-content:space-between"><div>'
      + '<div style="font-weight:800; font-size:16px">'+(w.first?"This week":fmtR(w.start,w.end))+'</div>'
      + '<div style="font-size:12.5px; color:'+sc.onSurfaceVar+'; font-weight:600">'+(w.first?fmtR(w.start,w.end):"Week of "+w.start.toLocaleDateString("en-US",{month:"short",day:"numeric"}))+'</div>'
      + '</div><div style="text-align:right">'
      + '<div style="font-weight:800; font-size:19px">'+money0(w.endBal)+'</div>'
      + '<div style="font-size:12px; font-weight:700; color:'+toneColor(cs2.key)+'">low '+money0(w.min)+'</div>'
      + '</div></div>';
    if (has){
      /* Day groups: a bold uppercase weekday header with its date, the moves
         under it, then one closing balance line carrying the running total. */
      const groups = [];
      [...w.events].sort((a,b)=>a.date-b.date).forEach(e => {
        const k = dayKey(e.date);
        if (!groups.length || groups[groups.length-1].k !== k) groups.push({ k: k, date: e.date, rows: [] });
        groups[groups.length-1].rows.push(e);
      });
      let running = w.startBal;
      const body = groups.map((g, gi) => {
        g.rows.forEach(e => { running = Math.round((running + e.amount) * 100) / 100; });
        const dayEnd = running;
        return '<div style="margin-top:'+(gi?10:0)+'px">'
          + '<div style="display:flex; align-items:center; gap:8px; margin-bottom:4px">'
          +   '<span style="font-size:11px; font-weight:800; letter-spacing:.8px; color:'+sc.primary+'; text-transform:uppercase">'
          +     g.date.toLocaleDateString("en-US",{weekday:"long"}) + " \u00B7 " + (g.date.getMonth()+1) + "/" + g.date.getDate()
          +   '</span>'
          +   '<span style="flex:1; height:1px; background:'+sc.surfaceCHH+'"></span>'
          + '</div>'
          + g.rows.map(e =>
              '<div style="display:flex; align-items:center; justify-content:space-between; font-size:13.5px; padding:2px 0 2px 8px">'
              + '<span style="color:'+sc.onSurfaceVar+'; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:inline-flex; align-items:center; gap:6px">'+e.label
              /* A bill whose due day has already gone by is pulled onto today and
                 flagged, exactly as the app does it. */
              + (e.late ? '<span style="background:'+sc.dangerC+'; color:'+sc.danger+'; font-size:9.5px; font-weight:800; padding:1px 6px; border-radius:999px; flex-shrink:0">late</span>' : '')
              + '</span>'
              + '<span style="font-weight:700; color:'+(e.amount>=0?sc.good:sc.onSurfaceVar)+'">'+(e.amount>=0?"+":"\u2212")+money(Math.abs(e.amount))+'</span>'
              + '</div>').join("")
          + '<div style="display:flex; align-items:center; justify-content:space-between; font-size:12.5px; padding:3px 0 0 8px">'
          +   '<span style="color:'+sc.onSurfaceVar+'; font-weight:700; opacity:.7">balance</span>'
          +   '<span style="font-weight:800; font-size:13.5px; color:'+(dayEnd<0?sc.danger:sc.onSurface)+'">'+money0(dayEnd)+'</span>'
          + '</div></div>';
      }).join("");
      card += '<div class="su-wk-cue" id="suwkcue'+w.idx+'" data-open-label="'+openLabel+'" style="margin-top:10px; color:'+sc.primary+'; font-weight:700; font-size:13.5px">'
        + '<span class="su-wk-caret">&#9662;</span>' + (open ? "Collapse" : openLabel) + '</div>'
        + '<div class="su-wk-body"><div class="su-wk-bodyinner"><div style="margin-top:10px; display:flex; flex-direction:column; gap:6px">'
        + body + '</div></div></div>';
    }
    return card + '</div>';
  }).join("") + '</div>';
  document.getElementById("planHost").innerHTML = h;
}

/* ── navigation ── */
let cur=0;
function go(n, back){
  if (n===cur) return;
  /* Read the cards before leaving: nothing was ever "added", so the state has to
     be taken from what is on screen right now. */
  collectIncome(); collectBills();
  if (typeof back === "undefined") back = n < cur;   /* jumping backwards slides backwards */
  if (n===4) renderPlan();                        /* the reveal is computed on arrival */
  const from=document.getElementById("pg"+cur), to=document.getElementById("pg"+n);
  from.classList.remove("on"); from.classList.toggle("off-l", !back);
  to.classList.remove("off-l");
  setTimeout(()=>to.classList.add("on"), 40);
  cur=n;
}
let chosenPlan = 1;   /* yearly is preselected */
function pick(i){
  chosenPlan = i;
  document.querySelectorAll(".plan").forEach((p,n)=>{
    const on = n===i;
    p.style.borderColor = on ? sc.primary : sc.outlineVar;
    p.style.boxShadow = on ? "0 0 0 1.5px "+sc.primary+" inset" : "none";
    if (on) { p.classList.remove("pop"); void p.offsetWidth; p.classList.add("pop"); }
    else p.classList.remove("pop");
  });
  document.getElementById("cta").textContent = i===2 ? "Get lifetime access" : "Start my free 10 days";
}
/* The reminder promise, drawn as the app's own three-step timeline. Day 8 is the
   point that makes it risk-free, so it gets named explicitly with its date. */
const TRIAL_DAYS = 10, TRIAL_WARN_DAY = 8;
(function buildTimeline(){
  const fmt = n => addDays(sod(new Date()), n).toLocaleDateString("en-US",{month:"long",day:"numeric"});
  const OKC = sc.good, OK_ON = sc.dark ? "#0f3d20" : "#ffffff";
  const check = c => '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="'+c+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17.5 L19 7"/></svg>';
  const bell  = c => '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="'+c+'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>';
  const steps = [
    { bg: sc.primary, ic: check(sc.onPrimary), t: "Today", h: "Full access to everything", b: "" },
    { bg: sc.primary, ic: bell(sc.onPrimary),  t: "Day " + TRIAL_WARN_DAY + " \u00b7 " + fmt(TRIAL_WARN_DAY),
      h: "We remind you the trial is ending", b: "Two days before anything is charged. If it isn't for you, we'll help you cancel." },
    { bg: OKC, ic: check(OK_ON), t: "Day " + TRIAL_DAYS + " \u00b7 " + fmt(TRIAL_DAYS),
      h: "Your subscription starts", b: "Only if you decided to stay." }
  ];
  document.getElementById("timeline").innerHTML = steps.map((s2,i) =>
    '<div style="display:flex; gap:12px; align-items:flex-start">'
    + '<div style="display:flex; flex-direction:column; align-items:center; flex:0 0 auto">'
    +   '<div style="width:32px; height:32px; border-radius:999px; background:'+s2.bg+'; display:flex; align-items:center; justify-content:center">'+s2.ic+'</div>'
    +   (i<steps.length-1 ? '<div style="width:2.5px; height:'+(s2.b?46:30)+'px; background:'+sc.outlineVar+'; border-radius:99px"></div>' : '')
    + '</div>'
    + '<div style="padding-bottom:'+(i<steps.length-1?10:0)+'px">'
    +   '<div style="font:800 11.5px system-ui,sans-serif; letter-spacing:.3px; color:'+(s2.bg===OKC?OKC:sc.primary)+'">'+s2.t.toUpperCase()+'</div>'
    +   '<div style="font:800 14.5px system-ui,sans-serif; color:'+sc.onSurface+'; margin-top:1px">'+s2.h+'</div>'
    +   (s2.b ? '<div style="font:600 12.5px system-ui,sans-serif; color:'+sc.onSurfaceVar+'; line-height:1.45; margin-top:3px">'+s2.b+'</div>' : '')
    + '</div></div>').join("");
})();


incAdd(); billAdd();   /* one empty card each, ready to type into */

/* The burden of proof is on this page now: the app assumes setup FAILED until
   this beacon arrives. Two animation frames guarantee a real paint happened;
   the size check catches the one failure a DOM check cannot — a screen that
   exists but occupies no pixels. */
(function(){
  function measure(){
    var r = { w: 0, h: 0, ph: 0, vh: 0 };
    try{
      var el = document.getElementById("pg0"), ph = document.getElementById("phone");
      if (el){ r.w = el.offsetWidth || 0; r.h = el.offsetHeight || 0; }
      if (ph){ r.ph = ph.offsetHeight || 0; }
      r.vh = window.innerHeight || 0;
    }catch(_){}
    return r;
  }
  function announce(){
    var m = measure();
    var ok = m.w > 0 && m.h > 0 && m.ph > 0;
    try{ window.__ledgiiPainted = ok ? 1 : 0; }catch(_){}
    try{
      if (window.LedgiiSetupBridge && window.LedgiiSetupBridge.alive)
        /* Sizes travel with the verdict: if this ever collapses again, the app
           can say WHICH measurement was zero instead of showing a blank. */
        window.LedgiiSetupBridge.alive(ok ? "1" : "0",
          m.w + "x" + m.h + " page, " + m.ph + " container, " + m.vh + " window");
    }catch(_){}
  }
  /* A panel measured after the page loads resizes the window underneath it.
     Re-checking on resize turns a late measurement into a recovery instead of
     a permanent blank. */
  try{
    window.addEventListener("resize", function(){
      if (window.__ledgiiPainted !== 1) announce();
    });
  }catch(_){}
  if (window.requestAnimationFrame){
    requestAnimationFrame(function(){ requestAnimationFrame(announce); });
  } else setTimeout(announce, 50);
})();
const c=document.getElementById("code"), j=document.getElementById("join");
c.addEventListener("input",()=>{ c.value=c.value.toUpperCase().trim();
  const ok=c.value.length>=4;
  j.style.background=ok?sc.primary:sc.surfaceCHH; j.style.color=ok?sc.onPrimary:sc.onSurfaceVar; });
/* ── handoff ──
   The flow collects real data, so finishing hands it back to whichever host is
   running it: the Android bridge, or the web app's callback. Same HTML both ways. */
function payload(extra){
  return JSON.stringify(Object.assign({
    income: state.income, bills: state.bills, checking: state.checking,
    expected: state.expected, incomeOverrides: state.incomeOverrides
  }, extra || {}));
}
function handoff(obj){
  const p = payload(obj);
  try { if (window.LedgiiSetupBridge) { window.LedgiiSetupBridge.done(p); return; } } catch (_) {}
  try { if (window.__setupDone) { window.__setupDone(p); return; } } catch (_) {}
}
document.getElementById("cta").addEventListener("click", function(){
  const plan = ["monthly","yearly","lifetime"][chosenPlan];
  celebrate(plan, function(){ handoff({ plan: plan, joined: false }); });
});
/* Confirm, hold, then leave. Roughly 1.6s — long enough to register that it
   worked, short enough that nobody taps again wondering if it did. */
function celebrate(plan, then){
  const lifetime = plan === "lifetime";
  const wrap = document.createElement("div");
  wrap.className = "su-done";
  wrap.style.background = sc.surface;
  wrap.innerHTML =
    '<div class="su-ring" style="background:' + sc.primaryC + '">'
    + '<svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="' + sc.onPrimaryC
    + '" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17.5 L19 7"/></svg></div>'
    + '<h2 style="color:' + sc.onSurface + '">' + (lifetime ? "Ledgii is yours." : "You\u2019re all set.") + '</h2>'
    + '<p style="color:' + sc.onSurfaceVar + '">' + (lifetime
        ? "Pay once, never again. Your plan is ready."
        : "Your free " + TRIAL_DAYS + " days start now. We\u2019ll remind you on day " + TRIAL_WARN_DAY + ".") + '</p>';
  phone.appendChild(wrap);
  setTimeout(function(){
    phone.classList.add("su-leave");
    setTimeout(then, 380);          /* hand off as the last frame fades */
  }, 1250);
}
/* Finishing at the Plan page. Payments are not live, so there is nothing to
   choose here and no plan to report — the flow just hands the collected data
   back. The paywall (pg5) is still in the markup and still wired up; nothing
   navigates to it, which is what makes this reversible when the early-access
   page replaces it. */
function finish(){
  const wrap = document.createElement("div");
  wrap.className = "su-done";
  wrap.style.background = sc.surface;
  wrap.innerHTML =
    '<div class="su-ring" style="background:' + sc.primaryC + '">'
    + '<svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="' + sc.onPrimaryC
    + '" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 L10 17.5 L19 7"/></svg></div>'
    + '<h2 style="color:' + sc.onSurface + '">You\u2019re all set.</h2>'
    + '<p style="color:' + sc.onSurfaceVar + '">Your plan is ready. Everything you just entered is in the app.</p>';
  phone.appendChild(wrap);
  setTimeout(function(){
    phone.classList.add("su-leave");
    setTimeout(function(){ handoff({ joined: false }); }, 380);
  }, 1250);
}

j.addEventListener("click",()=>{ if(c.value.length>=4){
  /* Joining skips setup entirely: the partner's ledger arrives from the cloud. */
  handoff({ joined: true, code: c.value.trim() }); } });

  /* Inline handlers in the markup run in global scope, so the functions they
     call are exposed here rather than left in the closure. */
  return {
    go: go, pick: pick, finish: finish, toggleWeek: toggleWeek,
    incAdd: incAdd, incDel: incDel, incBi: incBi,
    billAdd: billAdd, billDel: billDel, billFreq: billFreq,
    setHorizon: function(w){ horizon = w; renderPlan(); },
    version: 2
  };
})();

</script>
</body></html>
